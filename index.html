<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--navy:#1b2a4a;--blue:#2e6fd8;--amber:#c9872d;--green:#3a9d63;--bg:#f6f8fb;--card:#fff;--line:#e6ebf2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:#2b3240;line-height:1.6}
.hero{background:linear-gradient(135deg,#1b2a4a,#24406b 55%,#2e6fd8);color:#fff;padding:24px 20px 18px;text-align:center}
.hero h1{font-size:27px;letter-spacing:1px;margin-bottom:6px;word-break:break-all;overflow-wrap:anywhere}
.hero .sub{font-size:14px;opacity:.9;margin-bottom:14px;word-break:break-all;overflow-wrap:anywhere}
.flights{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.flight{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:9px 14px;font-size:13px;text-align:left;min-width:235px}
.flight .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-bottom:6px}
.flight b{font-size:15px}.flight div{opacity:.92;margin-top:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.legend{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:#5a6474;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 15px;margin-bottom:10px}
.legend > span{display:flex;align-items:center;gap:6px}
.lic{font-size:14px;width:20px;text-align:center;flex:none}
.seq{display:inline-block;width:16px;height:16px;border-radius:50%;background:#5a6474;color:#fff;font-size:10px;font-weight:700;text-align:center;line-height:16px}
section.city{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.city-h{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid var(--line)}
.city-h h2{font-size:19px;color:var(--navy)}
.city-h .badge{font-size:12px;background:#e9f0fb;color:#2e6fd8;padding:2px 10px;border-radius:999px}
.body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.days{padding:2px 20px 12px;border-right:1px solid var(--line)}
.day{padding:7px 0;border-bottom:1px dashed var(--line)}
.day:last-child{border-bottom:none}
.day .d{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.day .c{width:10px;height:10px;border-radius:3px;display:inline-block}
.day .t{font-size:15px;font-weight:700;margin:1px 0 3px}
.day ul{margin:4px 0 0 18px;font-size:13px;color:#4a5364}
.day ul li{list-style:disc}
.map{padding:8px;position:relative}
#map-tokyo,#map-kamakura,#map-hakone,#map-osaka,#map-kyoto{height:470px;border-radius:12px;border:1px solid var(--line)}
.pin{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--pc);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;font-size:14px}
.pin.amber{--pc:#c9872d}.pin.green{--pc:#3a9d63}.pin.blue{--pc:#2e6fd8}.pin.purple{--pc:#8e6bd8}.pin.hotel{--pc:#6b4a2f}.pin.airport{--pc:#2e6fd8}.pin.opt{--pc:#a9b1bf;opacity:.78}
.pin .num{position:absolute;top:-6px;right:-6px;background:var(--navy);color:#fff;font-size:9.5px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.map-leg{background:rgba(255,255,255,.95);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;color:#3a4356;max-width:218px;line-height:1.7;cursor:pointer;overflow:hidden}
.map-leg .ml-hd{font-weight:700;color:var(--navy);padding:7px 10px;display:flex;align-items:center;gap:6px;white-space:nowrap;user-select:none}
.map-leg .ml-body{display:none;padding:0 10px 9px;cursor:default}
.map-leg.open .ml-body{display:block}
.map-leg .ml-i{display:flex;align-items:center;gap:6px;margin-top:2px}
.sw{width:20px;height:4px;border-radius:2px;display:inline-block;flex:none}
.ml-h{font-weight:700;color:#5a6474;margin-top:7px;font-size:11.5px}
.map-leg .ml-h:first-of-type{margin-top:4px}
.day-tag{background:#e9f0fb;color:#2e6fd8;font-size:11px;padding:0 6px;border-radius:999px;margin-right:4px}
.leaflet-tooltip{font-size:12px!important}
.plabel{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.94);border:1px solid #d3d9e2;border-radius:5px;padding:0 5px;font-size:10.5px;color:#2b3240;box-shadow:0 1px 3px rgba(0,0,0,.18);line-height:1.5;z-index:50;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.foot{text-align:center;font-size:12px;color:#9aa3b2;padding:2px 0 18px}
.loading{text-align:center;padding:40px;color:#9aa3b2}
.ov{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.ov-h{font-weight:700;color:var(--navy);font-size:13px;margin-bottom:6px}
.ov-grid{display:flex;flex-wrap:wrap;gap:5px}
.ov-day{background:#f0f4fb;border-radius:8px;padding:3px 8px;font-size:12px;color:#3a4356}
.ov-day b{color:#2e6fd8;margin-right:4px}
.tips{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:#4a5364}
.tips div{margin-top:3px}
@media(max-width:820px){
  .wrap{padding:0 12px}
  .hero{padding:18px 14px 14px}
  .hero h1{font-size:22px}
  .hero .sub{font-size:12.5px}
  .flight{min-width:0;flex:1 1 100%;padding:10px 14px}
  .body{grid-template-columns:1fr}
  .days{border-right:none;border-bottom:1px solid var(--line);padding:4px 14px 10px}
  .city-h{padding:12px 14px}
  .city-h h2{font-size:17px}
  section.city{margin-bottom:10px}
  .legend{font-size:11px;gap:8px;padding:7px 10px;justify-content:flex-start;flex-direction:column;align-items:flex-start;margin-bottom:6px}
  .legend > span{width:100%}
  .map{padding:8px}
  #map-tokyo,#map-kamakura,#map-hakone,#map-osaka,#map-kyoto{height:320px}
  .plabel{font-size:9.5px;max-width:110px}
  .ov{padding:8px 12px;margin-bottom:8px}
  .ov-day{font-size:11.5px}
  .tips{padding:8px 12px;font-size:12.5px;margin-bottom:8px}
  .day .t{font-size:14px}
  .day ul{font-size:12.5px}
  .map-leg{max-width:176px;font-size:11px}
  .map-leg .ml-hd{font-size:11.5px;padding:6px 9px}
  .map-leg .ml-body{max-height:188px;overflow:auto}
  .leaflet-touch .leaflet-control-zoom a,.leaflet-touch .leaflet-bar a,.leaflet-control-zoom a{width:44px;height:44px;line-height:44px;font-size:24px}
  .pwrap .plabel{display:none}
}

/* 可访问性与移动端细节 */
.leaflet-control-zoom a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.leaflet-control-zoom a:focus{outline:2px solid var(--blue);outline-offset:2px}
.map-leg .ml-body{overscroll-behavior:contain}
.flight div,.day .t,.day ul,.tips div,.ov-day{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){
  .leaflet-zoom-anim .leaflet-zoom-animated{transition:none!important}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 瓦片多源自动 fallback：Bing路网(日文汉字带街道) → Carto(全球道路图) → OSM
// 高德卫星在日本无真实影像(占位图"此区域无卫星图")已移除；不同网络自动切到能出的源。
const TILE_SOURCES=[
  {url:'https://ecn.t{s}.tiles.virtualearth.net/tiles/r{q}.jpeg?g=1', sub:['0','1','2','3','4','5','6','7'], attr:'&copy; Microsoft', max:19},
  {url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', sub:'abcd', attr:'&copy; OpenStreetMap &copy; CARTO', max:19},
  {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', sub:[], attr:'&copy; OpenStreetMap', max:19}
];
const ATTR='&copy; OpenStreetMap';
const ICON={amber:'👜',green:'⛩️',blue:'🚉',purple:'🛍️',hotel:'🏨',airport:'✈️',opt:'◌'};
const TYPE_COLOR={amber:'#c9872d',green:'#3a9d63',blue:'#2e6fd8',purple:'#8e6bd8',hotel:'#6b4a2f',airport:'#2e6fd8',opt:'#a9b1bf'};
const TYPE_NAME={amber:'二奢/买手店',green:'景点/古迹',blue:'车站/交通',purple:'商圈/观景',hotel:'酒店/机场',airport:'机场',opt:'备选(可选)'};
const app=document.getElementById('app');

function renderCity(cfg){
  const html=`
  <section class="city">
    <div class="city-h"><h2>${cfg.title}</h2><span class="badge">${cfg.badge}</span></div>
    <div class="body">
      <div class="days">${cfg.days.map(d=>`
        <div class="day">
          <div class="d"><span class="c" style="background:${d.color}"></span>${d.date} 周${weekday(d.date)}</div>
          <div class="t">${d.title}</div>
          <ul>${d.itinerary.map(i=>'<li>'+i+'</li>').join('')}</ul>
        </div>`).join('')}
      </div>
      <div class="map"><div id="map-${cfg.id}" data-id="${cfg.id}"></div></div>
    </div>
  </section>`;
  const tmp=document.createElement('div');tmp.innerHTML=html;
  return tmp.firstElementChild.outerHTML;
}
function weekday(s){const [mo,da]=s.split('/').map(Number);const d=new Date(2026,mo-1,da);return '日一二三四五六'[d.getDay()];}

function makeTileLayer(s){
  if((s.url||'').indexOf('{q}')>=0){ // Bing quadkey 瓦片，需自定义 getTileUrl
    const layer=L.tileLayer('',{subdomains:s.sub,maxZoom:s.max,attribution:s.attr});
    layer.getTileUrl=function(coords){
      const z=coords.z,x=coords.x,y=coords.y;
      let qk='';for(let i=z;i>0;i--){let d=0;const m=1<<(i-1);if(x&m)d+=1;if(y&m)d+=2;qk+=d;}
      const sub=this.options.subdomains[(x+y)%this.options.subdomains.length];
      return s.url.replace('{q}',qk).replace('{s}',sub);
    };
    return layer;
  }
  return L.tileLayer(s.url,{subdomains:s.sub,maxZoom:s.max,attribution:s.attr});
}
function addTiles(map){
  let idx=0;
  function load(){
    const s=TILE_SOURCES[idx];
    const layer=makeTileLayer(s);
    layer.addTo(map);
    let errs=0;
    layer.on('tileerror',()=>{
      errs++;
      if(errs>=8 && idx<TILE_SOURCES.length-1){ map.removeLayer(layer); idx++; load(); }
    });
  }
  load();
}
function renderMap(id,cfg){
  const isMobile=(window.innerWidth<=820)||('ontouchstart' in window && window.innerWidth<1000);
  const m=L.map('map-'+id,{scrollWheelZoom:!isMobile}).setView(cfg.center,cfg.zoom);
  addTiles(m);
  cfg.routes.forEach(r=>{
    const hotel=cfg.pois.find(p=>p.type==='hotel');
    const pts=(r.geom&&r.geom.length>1?r.geom:r.pts).map(pt=>((pt==='@hotel'&&hotel)?hotel.coord:pt));
    L.polyline(pts,{color:r.color,weight:4,opacity:.85,dashArray:r.dashed?'10 8':null})
     .addTo(m).bindPopup('<b>'+r.label+'</b>');
  });
  cfg.pois.forEach(p=>{
    const label=p.name.length>9?p.name.slice(0,9)+'…':p.name;
    const icon=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],
      html:'<div class="pwrap"><div class="pin '+p.type+'"><span class="ic">'+(ICON[p.type]||'📍')+'</span>'+(p.order>0?'<span class="num">'+p.order+'</span>':'')+'</div><div class="plabel">'+label+'</div></div>'});
    const mk=L.marker(p.coord,{icon}).addTo(m);
    const dayTag=p.day?('<span class="day-tag">'+p.day+'</span>'):'';
    mk.bindPopup('<b>'+dayTag+(ICON[p.type]||'')+' '+p.name+'</b><br>'+p.desc);
    mk.bindTooltip((p.order>0?p.order+'. ':'')+p.name,{direction:'top',offset:[0,-16]});
  });
  if(cfg.routes.length || cfg.pois.length){
    const leg=L.control({position:'topright'});
    leg.onAdd=()=>{const d=L.DomUtil.create('div','map-leg');
      const used=[...new Set(cfg.pois.map(p=>p.type))].filter(t=>TYPE_NAME[t]);
      d.innerHTML='<div class="ml-hd">🧭 '+cfg.city+' 图例 ▾</div><div class="ml-body">'
        +'<div class="ml-h">路线</div>'
        +cfg.routes.map(r=>'<div class="ml-i"><span class="sw" style="background:'+r.color+'"></span>'+r.label+'</div>').join('')
        +'<div class="ml-h">点位</div>'
        +used.map(t=>'<div class="ml-i"><span class="lic">'+(ICON[t]||'•')+'</span>'+TYPE_NAME[t]+'</div>').join('')
        +'</div>';
      d.querySelector('.ml-hd').onclick=()=>{const o=d.classList.toggle('open');d.querySelector('.ml-hd').textContent='🧭 '+cfg.city+' 图例 '+(o?'▴':'▾');};
      return d;};
    leg.addTo(m);
  }
  return m;
}

// 数据加载: 优先取 data.json(改了立刻生效);file:// 下浏览器禁止 fetch 本地文件
// (origin=null 被 CORS 拦),退回页面内联的同一份数据 → 双击/本地索引都能打开。
const loadData=()=>{
  const inline=()=>JSON.parse(document.getElementById('trip-data').textContent);
  if(location.protocol==='file:') return Promise.resolve(inline());
  return fetch('data.json?v='+Date.now())
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .catch(()=>inline());
};

    <div class="ov-day"><b>9/26</b>东京·六本木</div>
