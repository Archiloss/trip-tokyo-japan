<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国庆日本行 · 东进西出</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--navy:#1b2a4a;--blue:#2e6fd8;--amber:#c9872d;--green:#3a9d63;--bg:#f6f8fb;--card:#fff;--line:#e6ebf2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:#2b3240;line-height:1.6}
.hero{background:linear-gradient(135deg,#1b2a4a,#24406b 55%,#2e6fd8);color:#fff;padding:34px 22px 26px;text-align:center}
.hero h1{font-size:27px;letter-spacing:1px;margin-bottom:8px}
.hero .sub{font-size:14px;opacity:.9;margin-bottom:18px}
.flights{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.flight{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:11px 16px;font-size:13px;text-align:left;min-width:235px}
.flight .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-bottom:6px}
.flight b{font-size:15px}.flight div{opacity:.92;margin-top:3px}
.wrap{max-width:1120px;margin:0 auto;padding:20px}
.legend{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:#5a6474;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 15px;margin-bottom:18px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot.amber{background:#c9872d}.dot.green{background:#3a9d63}.dot.blue{background:#2e6fd8}.dot.purple{background:#8e6bd8}
.seq{display:inline-block;width:16px;height:16px;border-radius:50%;background:#5a6474;color:#fff;font-size:10px;font-weight:700;text-align:center;line-height:16px}
section.city{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;overflow:hidden}
.city-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.city-h h2{font-size:19px;color:var(--navy)}
.city-h .badge{font-size:12px;background:#e9f0fb;color:#2e6fd8;padding:2px 10px;border-radius:999px}
.body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.days{padding:4px 20px 14px;border-right:1px solid var(--line)}
.day{padding:9px 0;border-bottom:1px dashed var(--line)}
.day:last-child{border-bottom:none}
.day .d{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.day .c{width:10px;height:10px;border-radius:3px;display:inline-block}
.day .t{font-size:15px;font-weight:700;margin:1px 0 3px}
.day ul{margin:4px 0 0 18px;font-size:13px;color:#4a5364}
.day ul li{list-style:disc}
.map{padding:12px;position:relative}
#map-japan,#map-tokyo,#map-kamakura,#map-osaka,#map-kyoto{height:470px;border-radius:12px;border:1px solid var(--line)}
.pin{width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.amber{background:#c9872d}.pin.green{background:#3a9d63}.pin.blue{background:#2e6fd8}.pin.purple{background:#8e6bd8}.pin.hotel{background:#6b4a2f}.pin.opt{background:#a9b1bf;opacity:.62}
.map-leg{background:rgba(255,255,255,.95);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;color:#3a4356;max-width:212px;line-height:1.7;cursor:pointer;overflow:hidden}
.map-leg .ml-hd{font-weight:700;color:var(--navy);padding:7px 10px;display:flex;align-items:center;gap:6px;white-space:nowrap;user-select:none}
.map-leg .ml-body{display:none;padding:0 10px 9px;cursor:default}
.map-leg.open .ml-body{display:block}
.map-leg .ml-i{display:flex;align-items:center;gap:6px;margin-top:2px}
.sw{width:20px;height:4px;border-radius:2px;display:inline-block;flex:none}
.ml-h{font-weight:700;color:#5a6474;margin-top:7px;font-size:11.5px}
.map-leg .ml-h:first-of-type{margin-top:4px}
.dsq{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.day-tag{background:#e9f0fb;color:#2e6fd8;font-size:11px;padding:0 6px;border-radius:999px;margin-right:4px}
.leaflet-tooltip{font-size:12px!important}
.foot{text-align:center;font-size:12px;color:#9aa3b2;padding:6px 0 24px}
.loading{text-align:center;padding:40px;color:#9aa3b2}
@media(max-width:820px){
  .body{grid-template-columns:1fr}
  .days{border-right:none;border-bottom:1px solid var(--line)}
  #map-japan,#map-tokyo,#map-kamakura,#map-osaka,#map-kyoto{height:360px}
  .hero h1{font-size:22px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">加载行程数据…</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TILE='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const ATTR='&copy; OpenStreetMap';
const TYPE_COLOR={amber:'#c9872d',green:'#3a9d63',blue:'#2e6fd8',purple:'#8e6bd8',hotel:'#6b4a2f',opt:'#a9b1bf'};
const app=document.getElementById('app');

function renderCity(cfg){
  const html=`
  <section class="city">
    <div class="city-h"><h2>${cfg.title}</h2><span class="badge">${cfg.badge}</span></div>
    <div class="body">
      <div class="days">${cfg.days.map(d=>`
        <div class="day">
          <div class="d"><span class="c" style="background:${d.color}"></span>${d.date} 周${weekday(d.date)}</div>
          <div class="t">${d.title}</div>
          <ul>${d.itinerary.map(i=>'<li>'+i+'</li>').join('')}</ul>
        </div>`).join('')}
      </div>
      <div class="map"><div id="map-${cfg.id}" data-id="${cfg.id}"></div></div>
    </div>
  </section>`;
  const tmp=document.createElement('div');tmp.innerHTML=html;
  return tmp.firstElementChild.outerHTML;
}
function weekday(s){const m={9:'01',10:'02'};const d=new Date('2026-'+m[Number(s.slice(0,2))]+'-'+s.slice(3,5));return '日一二三四五六'[d.getDay()];}

function renderMap(id,cfg){
  const m=L.map('map-'+id,{scrollWheelZoom:true}).setView(cfg.center,cfg.zoom);
  L.tileLayer(TILE,{attribution:ATTR}).addTo(m);
  // 路线:色=route.color, 图例也=route.color(同源)
  cfg.routes.forEach(r=>{
    L.polyline(r.pts,{color:r.color,weight:4,opacity:.85,dashArray:r.dashed?'10 8':null})
     .addTo(m).bindPopup('<b>'+r.label+'</b>');
  });
  cfg.pois.forEach(p=>{
    const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],
      html:'<div class="pin '+p.type+'">'+(p.order>0?p.order:'')+'</div>'});
    const mk=L.marker(p.coord,{icon}).addTo(m);
    const dayTag=p.day?('<span class="day-tag">'+p.day+'</span>'):'';
    mk.bindPopup('<b>'+dayTag+p.name+'</b><br>'+p.desc);
    mk.bindTooltip((p.order>0?p.order+'. ':'')+p.name,{direction:'top',offset:[0,-14]});
  });
  // 局部图例:路线(线色)+点位(点色),对图上出现的一切颜色闭合
  if(cfg.routes.length || cfg.pois.length){
    const leg=L.control({position:'topright'});
    leg.onAdd=()=>{const d=L.DomUtil.create('div','map-leg');
      const tm={amber:'二奢/买手店',green:'景点/古迹',blue:'车站/交通',purple:'商圈/观景',hotel:'酒店/机场',opt:'备选(可选)'};
      const used=[...new Set(cfg.pois.map(p=>p.type))].filter(t=>tm[t]);
      d.innerHTML='<div class="ml-hd">🧭 '+cfg.city+' 图例 ▾</div><div class="ml-body">'
        +'<div class="ml-h">路线</div>'
        +cfg.routes.map(r=>'<div class="ml-i"><span class="sw" style="background:'+r.color+'"></span>'+r.label+'</div>').join('')
        +'<div class="ml-h">点位</div>'
        +used.map(t=>'<div class="ml-i"><span class="dsq" style="background:'+TYPE_COLOR[t]+'"></span>'+tm[t]+'</div>').join('')
        +'</div>';
      d.querySelector('.ml-hd').onclick=()=>{const o=d.classList.toggle('open');d.querySelector('.ml-hd').textContent='🧭 '+cfg.city+' 图例 '+(o?'▴':'▾');};
      return d;};
    leg.addTo(m);
  }
  return m;
}

fetch('data.json?v='+Date.now()).then(r=>r.json()).then(data=>{
  const mf=data.meta;
  let hero=`<div class="hero"><h1>✈️ ${mf.title}</h1><div class="sub">${mf.subtitle}</div>
    <div class="flights">${mf.flights.map(f=>
      `<div class="flight"><span class="tag" style="background:${f.color}">${f.tag}</span><br><b>${f.date}</b><div>${f.desc}</div></div>`).join('')}
    </div></div>`;
  const legend=`<div class="wrap"><div class="legend">
    <span><span class="dot amber"></span>二奢/买手店</span>
    <span><span class="dot green"></span>景点/公园</span>
    <span><span class="dot blue"></span>车站/交通</span>
    <span><span class="dot purple"></span>商圈/市区</span>
    <span><span class="seq">1</span>数字=当天走访顺序</span>
    <span>色点/色条=当天路线(见各图右上角)</span>
  </div>`;
  const sections=data.cities.map(c=>renderCity(c)).join('');
  const foot=`<div class="foot">二奢店位置为街区示意,以实际门店为准 · 数字=当天先后顺序 · 数据源 data.json · 地图 © OpenStreetMap · Leaflet</div></div>`;
  app.innerHTML=hero+legend+sections+foot;
  data.cities.forEach(c=>renderMap(c.id,c));
}).catch(e=>{app.innerHTML='<div class="loading">加载失败: '+e.message+'<br>请用 http(s) 打开(直接双击 file:// 会被浏览器拦截)。</div>';});
</script>
</body>
</html>
