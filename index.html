<!DOCTYPE html>
<html lang="zh-CN">

<title>国庆日本行 · 东进西出</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--navy:#1b2a4a;--blue:#2e6fd8;--amber:#c9872d;--green:#3a9d63;--bg:#f6f8fb;--card:#fff;--line:#e6ebf2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:#2b3240;line-height:1.6}
.hero{background:linear-gradient(135deg,#1b2a4a,#24406b 55%,#2e6fd8);color:#fff;padding:24px 20px 18px;text-align:center}
.hero h1{font-size:27px;letter-spacing:1px;margin-bottom:6px;word-break:break-all;overflow-wrap:anywhere}
.hero .sub{font-size:14px;opacity:.9;margin-bottom:14px;word-break:break-all;overflow-wrap:anywhere}
.flights{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.flight{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:9px 14px;font-size:13px;text-align:left;min-width:235px}
.flight .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-bottom:6px}
.flight b{font-size:15px}.flight div{opacity:.92;margin-top:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section.city{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.city-h{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid var(--line)}
.city-h h2{font-size:19px;color:var(--navy)}
.city-h .badge{font-size:12px;background:#e9f0fb;color:#2e6fd8;padding:2px 10px;border-radius:999px}
.body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.days{padding:2px 20px 12px;border-right:1px solid var(--line)}
.day{padding:7px 0;border-bottom:1px dashed var(--line)}
.day:last-child{border-bottom:none}
.day .d{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}.day .c{width:10px;height:10px;border-radius:3px;display:inline-block}
.day .t{font-size:15px;font-weight:700;margin:1px 0 3px}
.day ul{margin:4px 0 0 18px;font-size:13px;color:#4a5364}
.day ul li{list-style:disc}
.map{padding:8px;position:relative}
#map-tokyo,#map-kamakura,#map-hakone,#map-osaka,#map-kyoto{height:470px;border-radius:12px;border:1px solid var(--line)}
.pin{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--pc);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;font-size:14px}
.pin.amber{--pc:#c9872d}.pin.green{--pc:#3a9d63}.pin.blue{--pc:#2e6fd8}.pin.purple{--pc:#8e6bd8}.pin.hotel{--pc:#6b4a2f}.pin.airport{--pc:#2e6fd8}.pin.opt{--pc:#a9b1bf;opacity:.78}
.pin .num{position:absolute;top:-6px;right:-6px;background:var(--navy);color:#fff;font-size:9.5px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.map-leg{background:rgba(255,255,255,.95);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;color:#3a4356;max-width:218px;line-height:1.7;cursor:pointer;overflow:hidden}
.map-leg .ml-hd{font-weight:700;color:var(--navy);padding:7px 10px;display:flex;align-items:center;gap:6px;white-space:nowrap;user-select:none}
.map-leg .ml-body{display:none;padding:0 10px 9px;cursor:default}
.map-leg.open .ml-body{display:block}
.map-leg .ml-i{display:flex;align-items:center;gap:6px;margin-top:2px}
.sw{width:20px;height:4px;border-radius:2px;display:inline-block;flex:none}
.ml-h{font-weight:700;color:#5a6474;margin-top:7px;font-size:11.5px}
.map-leg .ml-h:first-of-type{margin-top:4px}
.day-tag{background:#e9f0fb;color:#2e6fd8;font-size:11px;padding:0 6px;border-radius:999px;margin-right:4px}
.leaflet-tooltip{font-size:12px!important}
.plabel{position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.94);border:1px solid #d3d9e2;border-radius:5px;padding:0 5px;font-size:10.5px;color:#2b3240;box-shadow:0 1px 3px rgba(0,0,0,.18);line-height:1.5;z-index:50;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.foot{text-align:center;font-size:12px;color:#9aa3b2;padding:2px 0 18px}
.loading{text-align:center;padding:40px;color:#9aa3b2}
.ov{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.ov-h{font-weight:700;color:var(--navy);font-size:13px;margin-bottom:6px}
.ov-grid{display:flex;flex-wrap:wrap;gap:5px}
.ov-day{background:#f0f4fb;border-radius:8px;padding:3px 8px;font-size:12px;color:#3a4356}
.ov-day b{color:#2e6fd8;margin-right:4px}
.tips{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px;color:#4a5364}
.tips div{margin-top:3px}
/* ===== 侧边栏导航 ===== */
.layout{display:flex;align-items:flex-start}
.side{position:sticky;top:0;flex:0 0 168px;height:100vh;overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:12px 9px;z-index:1300}
.side .s-h{font-size:11px;color:#9aa3b2;letter-spacing:1px;padding:2px 9px 9px}
.side a{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;font-size:13.5px;color:#3a4356;text-decoration:none;margin-bottom:3px;white-space:nowrap}
.side a:hover{background:#f0f4fb}
.side a.on{background:#e9f0fb;color:#2e6fd8;font-weight:700}
.main{flex:1 1 auto;min-width:0}
/* ===== 美食地图 ===== */
.food-h{display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-bottom:1px solid var(--line)}
.food-h h2{font-size:19px;color:var(--navy)}
.food-h .badge{font-size:12px;background:#e9f0fb;color:#2e6fd8;padding:2px 10px;border-radius:999px}
.food-note{font-size:12.5px;color:#8a93a3;padding:9px 20px 11px;border-top:1px dashed var(--line)}
#map-food{height:470px;border-radius:12px;margin:8px}
.food-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.food-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.food-card .fc-h{padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.food-card .fc-h .badge{font-size:11.5px;background:#f0f4fb;color:#5a6474;padding:1px 8px;border-radius:999px;font-weight:400;white-space:nowrap}
.food-card ul{padding:5px 16px 12px;list-style:none}
.food-card li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.food-card li:last-child{border-bottom:none}
.food-card li .nm{font-weight:700;color:#2b3240}
.food-card li .mt{font-size:11.5px;color:#8a93a3;margin-top:1px}
.tier-row{display:flex;border-bottom:1px solid var(--line)}
.tier-row:last-child{border-bottom:none}
.tier-lab{flex:0 0 60px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;text-align:center;line-height:1.25;padding:6px 2px}
.tier-items{padding:8px 12px;font-size:13px;line-height:2;flex:1 1 auto;min-width:0;word-break:break-word}
.bdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chip-n{font-size:10.5px;background:#fff3e0;color:#c9872d;border-radius:999px;padding:0 6px;margin-left:5px;vertical-align:1px}
.dot-closed{color:#8a93a3}
/* 美食地图图例(内嵌,带勾选) */
.map-leg .ml-cb{display:flex;align-items:center;gap:6px;margin-top:4px;cursor:pointer;user-select:none}
.map-leg .ml-cb input{margin:0;cursor:pointer}
.map-leg .ml-sub{font-size:10.5px;color:#8a93a3;margin:1px 0 0 19px}
/* 定位条 */
.food-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:#fbfdff}
.loc-btn{background:#2e6fd8;color:#fff;border:none;border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.loc-btn:hover{background:#2559b0}
.loc-btn:disabled{background:#b9c6d8;cursor:default}
.loc-msg{font-size:12.5px;color:#8a93a3}
.loc-panel{margin:8px;padding:10px 12px;background:#f7faff;border:1px solid #e3ecf8;border-radius:12px;font-size:13px}
.loc-panel[hidden]{display:none}
.loc-panel .lp-h{font-weight:700;color:var(--navy);margin-bottom:6px;font-size:13px}
.loc-panel .lp-i{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #e3ecf8}
.loc-panel .lp-i:last-child{border-bottom:none}
.loc-panel .lp-d{color:#2e6fd8;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.loc-panel .lp-t{color:#8a93a3;font-size:11.5px}
/* 地区切换 + 店名单 */
.region-tabs{display:flex;gap:6px;flex-wrap:wrap}
.rtab{background:#f4f7fc;border:1px solid #e3ecf8;color:#3a4356;border-radius:999px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px}
.rtab:hover{background:#e9f0fb}
.rtab.on{background:#2e6fd8;border-color:#2e6fd8;color:#fff}
.rtab .rc{font-size:11px;background:rgba(0,0,0,.08);border-radius:999px;padding:0 6px}
.rtab.on .rc{background:rgba(255,255,255,.25)}
.food-sub{font-size:12.5px;color:#8a93a3;padding:8px 20px 0}
.food-list summary{cursor:pointer;padding:12px 20px;font-weight:700;color:var(--navy);font-size:14px;list-style:none}
.food-list summary::-webkit-details-marker{display:none}
.food-list summary::before{content:'▸ ';color:#8a93a3}
.food-list[open] summary::before{content:'▾ '}
.food-list .fl-body{padding:0 20px 12px;font-size:13px}
.lp-r{display:flex;gap:6px;padding:2px 20px 8px}
.rbtn{background:#f4f7fc;border:1px solid #e3ecf8;color:#3a4356;border-radius:999px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.rbtn.on{background:#2e6fd8;border-color:#2e6fd8;color:#fff}
.lp-i.over{border-left-color:#e58f2b}
.lp-w{color:#2e6fd8;font-size:11px;font-weight:600}
.lp-note{padding:8px 20px 12px;color:#8a93a3;font-size:11.5px;line-height:1.6}
.src-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px 0}
.chip{border:1px solid #e3ecf8;background:#fff;color:#5a6474;border-radius:999px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.off{opacity:.45;color:#aab3c0}
.chip b{font-weight:700;font-size:11px;opacity:.9}
.chip-key{display:flex;align-items:center;gap:9px;font-size:11px;color:#8a93a3;margin-left:2px}
.chip-key .key{display:flex;align-items:center;gap:3px}
.chip-key i{width:8px;height:8px;border-radius:50%;display:inline-block}
.mleg{padding:2px 14px 11px}
.mleg-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 11px;font-size:11.5px;color:#5a6474;margin-top:5px}
.mleg-h{font-weight:700;color:var(--navy)}
.mleg-i{display:flex;align-items:center;gap:4px}
.mleg-i .ln{width:16px;height:3px;border-radius:2px;display:inline-block}
.mleg-i .ic{font-style:normal}
.fl-src{font-weight:700;color:var(--navy);margin:9px 0 3px;font-size:13px;display:flex;align-items:center;gap:5px}
.fl-i{padding:3px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.fl-i:last-child{border-bottom:none}
.fl-d{color:#8a93a3;font-size:11.5px;white-space:nowrap;flex:none}
@media(max-width:820px){
  .layout{display:block}
  .side{position:sticky;top:0;flex:none;height:auto;display:flex;align-items:center;gap:5px;overflow-x:auto;padding:8px 10px;border-right:none;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .side .s-h{display:none}
  .side a{padding:5px 11px;background:#f4f7fc;border-radius:999px;font-size:12.5px;margin:0;flex:none}
  .side a.on{background:#2e6fd8;color:#fff}
  .wrap{padding:0 12px}
  .hero{padding:18px 14px 14px}
  .hero h1{font-size:22px}
  .hero .sub{font-size:12.5px}
  .flight{min-width:0;flex:1 1 100%;padding:10px 14px}
  .body{grid-template-columns:1fr}
  .days{border-right:none;border-bottom:1px solid var(--line);padding:4px 14px 10px}
  .city-h{padding:12px 14px}
  .city-h h2{font-size:17px}
  section.city{margin-bottom:10px}
  .map{padding:8px}
  #map-tokyo,#map-kamakura,#map-hakone,#map-osaka,#map-kyoto{height:min(52vh,380px)}
  .mleg{padding:2px 10px 10px}
  .mleg-row{font-size:11px;gap:4px 9px}
  #map-food{height:min(58vh,430px);margin:6px}
  .food-h .badge{display:none}
  .region-tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .region-tabs::-webkit-scrollbar{display:none}
  .rtab{flex:0 0 auto;padding:5px 9px;font-size:12px;gap:4px}
  .rtab .rc{font-size:10.5px;padding:0 5px}
  .rtab .rcb{display:none}
  .food-sub{font-size:11.5px;padding:6px 12px 0}
  .src-chips{padding:8px 12px 0}
  .chip{padding:5px 10px;font-size:11.5px}
  .food-note{padding:8px 12px 12px;font-size:11.5px}
  .food-cols{grid-template-columns:1fr;gap:0}
  .food-h{padding:12px 14px}
  .food-h h2{font-size:17px}
  .food-note{padding:8px 14px 10px;font-size:12px}
  .tier-items{font-size:12.5px}
  .map-leg .ml-sub{margin-left:19px}
  [id^="sec-"]{scroll-margin-top:56px}
  .plabel{font-size:9.5px;max-width:110px}
  .ov{padding:8px 12px;margin-bottom:8px}
  .ov-day{font-size:11.5px}
  .tips{padding:8px 12px;font-size:12.5px;margin-bottom:8px}
  .day .t{font-size:14px}
  .day ul{font-size:12.5px}
  .map-leg{max-width:176px;font-size:11px}
  .map-leg .ml-hd{font-size:11.5px;padding:6px 9px}
  .map-leg .ml-body{max-height:188px;overflow:auto}
  .leaflet-touch .leaflet-control-zoom a,.leaflet-touch .leaflet-bar a,.leaflet-control-zoom a{width:44px;height:44px;line-height:44px;font-size:24px}
  .pwrap .plabel{display:none}
}

/* 可访问性与移动端细节 */
.leaflet-control-zoom a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.leaflet-control-zoom a:focus{outline:2px solid var(--blue);outline-offset:2px}
.map-leg .ml-body{overscroll-behavior:contain}
.flight div,.day .t,.day ul,.tips div,.ov-day{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){
  .leaflet-zoom-anim .leaflet-zoom-animated{transition:none!important}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 瓦片多源自动 fallback：Bing路网(日文汉字带街道) → Carto(全球道路图) → OSM
// 高德卫星在日本无真实影像(占位图"此区域无卫星图")已移除；不同网络自动切到能出的源。
const TILE_SOURCES=[
  {url:'https://ecn.t{s}.tiles.virtualearth.net/tiles/r{q}.jpeg?g=1', sub:['0','1','2','3','4','5','6','7'], attr:'&copy; Microsoft', max:19},
  {url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', sub:'abcd', attr:'&copy; OpenStreetMap &copy; CARTO', max:19},
  {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', sub:[], attr:'&copy; OpenStreetMap', max:19}
];
const ATTR='&copy; OpenStreetMap';
const ICON={amber:'👜',green:'⛩️',blue:'🚉',purple:'🛍️',hotel:'🏨',airport:'✈️',opt:'◌'};
const TYPE_COLOR={amber:'#c9872d',green:'#3a9d63',blue:'#2e6fd8',purple:'#8e6bd8',hotel:'#6b4a2f',airport:'#2e6fd8',opt:'#a9b1bf'};
const TYPE_NAME={amber:'二奢/买手店',green:'景点/古迹',blue:'车站/交通',purple:'商圈/观景',hotel:'酒店/机场',airport:'机场',opt:'备选(可选)'};
const app=document.getElementById('app');

function renderCity(cfg){
  const html=`
  <section class="city">
    <div class="city-h"><h2>${cfg.title}</h2><span class="badge">${cfg.badge}</span></div>
    <div class="body">
      <div class="days">${cfg.days.map(d=>`
        <div class="day">
          <div class="d"><span class="c" style="background:${d.color}"></span>${d.date} 周${weekday(d.date)}</div>
          <div class="t">${d.title}</div>
          <ul>${d.itinerary.map(i=>'<li>'+i+'</li>').join('')}</ul>
        </div>`).join('')}
      </div>
      <div class="map"><div id="map-${cfg.id}" data-id="${cfg.id}"></div><div class="mleg" id="leg-${cfg.id}"></div></div>
    </div>
  </section>`;
  const tmp=document.createElement('div');tmp.innerHTML=html;
  return tmp.firstElementChild.outerHTML;
}
function weekday(s){const [mo,da]=s.split('/').map(Number);const d=new Date(2026,mo-1,da);return '日一二三四五六'[d.getDay()];}

function makeTileLayer(s){
  if((s.url||'').indexOf('{q}')>=0){ // Bing quadkey 瓦片，需自定义 getTileUrl
    const layer=L.tileLayer('',{subdomains:s.sub,maxZoom:s.max,attribution:s.attr});
    layer.getTileUrl=function(coords){
      const z=coords.z,x=coords.x,y=coords.y;
      let qk='';for(let i=z;i>0;i--){let d=0;const m=1<<(i-1);if(x&m)d+=1;if(y&m)d+=2;qk+=d;}
      const sub=this.options.subdomains[(x+y)%this.options.subdomains.length];
      return s.url.replace('{q}',qk).replace('{s}',sub);
    };
    return layer;
  }
  return L.tileLayer(s.url,{subdomains:s.sub,maxZoom:s.max,attribution:s.attr});
}
function addTiles(map){
  let idx=0;
  function load(){
    const s=TILE_SOURCES[idx];
    const layer=makeTileLayer(s);
    layer.addTo(map);
    let errs=0;
    layer.on('tileerror',()=>{
      errs++;
      if(errs>=8 && idx<TILE_SOURCES.length-1){ map.removeLayer(layer); idx++; load(); }
    });
  }
  load();
}
function renderMap(id,cfg){
  const isMobile=(window.innerWidth<=820)||('ontouchstart' in window && window.innerWidth<1000);
  const m=L.map('map-'+id,{scrollWheelZoom:!isMobile}).setView(cfg.center,cfg.zoom);
  addTiles(m);
  cfg.routes.forEach(r=>{
    const hotel=cfg.pois.find(p=>p.type==='hotel');
    const pts=(r.geom&&r.geom.length>1?r.geom:r.pts).map(pt=>((pt==='@hotel'&&hotel)?hotel.coord:pt));
    L.polyline(pts,{color:r.color,weight:4,opacity:.85,dashArray:r.dashed?'10 8':null})
     .addTo(m).bindPopup('<b>'+r.label+'</b>');
  });
  cfg.pois.forEach(p=>{
    const label=p.name.length>9?p.name.slice(0,9)+'…':p.name;
    const icon=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],
      html:'<div class="pwrap"><div class="pin '+p.type+'"><span class="ic">'+(ICON[p.type]||'📍')+'</span>'+(p.order>0?'<span class="num">'+p.order+'</span>':'')+'</div><div class="plabel">'+label+'</div></div>'});
    const mk=L.marker(p.coord,{icon}).addTo(m);
    const dayTag=p.day?('<span class="day-tag">'+p.day+'</span>'):'';
    mk.bindPopup('<b>'+dayTag+(ICON[p.type]||'')+' '+p.name+'</b><br>'+p.desc);
    mk.bindTooltip((p.order>0?p.order+'. ':'')+p.name,{direction:'top',offset:[0,-16]});
  });
  if(isMobile){                       // 手机上按全部点位自动取景(固定中心/缩放在窄屏会切掉点)
    const all=[];
    cfg.pois.forEach(p=>all.push(p.coord));
    cfg.routes.forEach(r=>{
      const pts=(r.geom&&r.geom.length>1?r.geom:r.pts);
      pts.forEach(pt=>all.push(pt==='@hotel'?(cfg.pois.find(p=>p.type==='hotel')||{}).coord||pt:pt));
    });
    const ok=all.filter(q=>Array.isArray(q)&&q.length===2&&typeof q[0]==='number');
    if(ok.length>1) m.fitBounds(L.latLngBounds(ok).pad(0.14));
  }
  const strip=document.getElementById('leg-'+id);
  if(strip && (cfg.routes.length||cfg.pois.length)){
    const used=[...new Set(cfg.pois.map(p=>p.type))].filter(t=>TYPE_NAME[t]);
    let hh='';
    if(cfg.routes.length) hh+='<div class="mleg-row"><span class="mleg-h">路线</span>'
      +cfg.routes.map(r=>'<span class="mleg-i"><i class="ln" style="background:'+r.color+'"></i>'+r.label+'</span>').join('')+'</div>';
    if(used.length) hh+='<div class="mleg-row"><span class="mleg-h">点位</span>'
      +used.map(t=>'<span class="mleg-i"><i class="ic">'+(ICON[t]||'•')+'</i>'+TYPE_NAME[t]+'</span>').join('')+'</div>';
    strip.innerHTML=hh;
  }
  return m;
}

/* ===== 美食地图（多城市 · Tabelog百名店 / tier榜 / 自己找的） ===== */
const SRC_META={
  tabelog:{ic:'🏆',name:'Tabelog 百名店',short:'百名店',color:'#2fb98c'},
  tier:{ic:'🔥',name:'tier 榜(网友)',short:'tier 榜',color:'#d64541'},
  mine:{ic:'📌',name:'自己找的',short:'自己找的',color:'#2e6fd8'}
};
const TIER_COLOR={夯:'#d64541',顶级:'#e58f2b',人上人:'#8e6bd8',NPC:'#2e6fd8',拉:'#9aa3b2'};
const TIERS=['夯','顶级','人上人'];
const DROP_TIERS=['NPC','拉'];
const isDropped=s=>s.src==='tier'&&DROP_TIERS.indexOf(s.tier)>=0;
const REGION_CENTER={tokyo:[35.70,139.72],kanagawa:[35.40,139.55],osaka:[34.68,135.51],kyoto:[35.00,135.76]};
const FOOD={map:null,layer:null,region:null,data:null,radius:3000,enabled:{tabelog:true,tier:true,mine:true}};
function foodShops(){return FOOD.data?FOOD.data.shops.filter(s=>!isDropped(s)&&s.lat!=null&&s.lon!=null):[];}
function foodColor(s){return s.src==='tier'?(TIER_COLOR[s.tier]||'#8e6bd8'):((SRC_META[s.src]||{}).color||'#8899aa');}
function foodRegionShops(r){return foodShops().filter(s=>s.region===r);}

function renderFood(food){
  FOOD.data=food;
  FOOD.region=(food.regions[0]||{}).id;
  const tabs=food.regions.map((r,i)=>{
    const n=food.shops.filter(s=>s.region===r.id&&!isDropped(s)&&s.lat!=null).length;
    return '<button type="button" class="rtab'+(i===0?' on':'')+'" data-r="'+r.id+'">'+r.name
      +'<span class="rc">'+n+'</span>'+(r.badge?'<span class="rc rcb">'+r.badge+'</span>':'')+'</button>';
  }).join('');
  return '<div class="wrap" id="sec-food">'
   + '<div class="food-card"><div class="food-h"><h2>🍜 美食地图 · 拉面</h2>'
   + '<span class="badge">Tabelog 百名店 2025 · tier 榜 · 自己找的</span></div>'
   + '<div class="food-bar"><div class="region-tabs">'+tabs+'</div>'
   + '<button type="button" id="btn-locate" class="loc-btn">📍 我附近的美食</button></div>'
   + '<div class="food-sub" id="loc-msg">点「我附近的美食」只取一次位置(不持续追踪)，只在 <b>3km</b>（约步行 40 分钟）内找；需在 https 页面才给定位</div>'
   + '<div id="loc-panel" class="loc-panel" hidden></div>'
   + '<div id="map-food"></div>'
   + '<div class="src-chips" id="food-chips"></div>'
   + '<div class="food-note" id="food-note"></div></div>'
   + '<details class="food-card food-list"><summary>📋 本地区店名单</summary><div class="fl-body" id="food-list-body"></div></details>'
   + '</div>';
}

function renderFoodMap(){
  const isMobile=(window.innerWidth<=820)||('ontouchstart' in window && window.innerWidth<1000);
  const m=L.map('map-food',{scrollWheelZoom:!isMobile}).setView(REGION_CENTER[FOOD.region]||[35.68,139.75],11);
  FOOD.map=m; window._foodMap=m;
  addTiles(m);
  FOOD.layer=L.layerGroup().addTo(m);
}

function drawFood(){
  if(!FOOD.map) return;
  FOOD.layer.clearLayers();
  const all=foodRegionShops(FOOD.region);
  const list=all.filter(s=>FOOD.enabled[s.src]);
  list.forEach(s=>{
    const col=foodColor(s), size=s.src==='tier'?14:16;
    const icon=L.divIcon({className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],
      html:'<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+col+';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>'});
    const mk=L.marker([s.lat,s.lon],{icon});
    const srcTag=s.src==='tier'?('tier 榜 · '+s.tier):(SRC_META[s.src]||{}).name;
    mk.bindPopup('<b>'+s.name+'</b><br><span class="day-tag">'+srcTag+'</span>'
      +(s.score?'<br>⭐ Tabelog '+s.score:'')
      +(s.addr?'<br>📍 '+s.addr:'')
      +(s.closed?'<br>🕒 定休 '+s.closed:'')
      +(s.url?'<br><a href="'+s.url+'" target="_blank" rel="noopener">看 Tabelog 页 →</a>'
             :'<br><span style="color:#8a93a3;font-size:11px">坐标为街区示意</span>'));
    mk.bindTooltip(s.name,{direction:'top',offset:[0,-10]});
    mk.addTo(FOOD.layer);
  });
  if(list.length) FOOD.map.fitBounds(L.latLngBounds(list.map(s=>[s.lat,s.lon])).pad(0.12));
  else FOOD.map.setView(REGION_CENTER[FOOD.region]||[35.68,139.75],11);
  updateFoodUI(all,list);
}

function updateFoodUI(all,list){
  const counts={};
  all.forEach(s=>counts[s.src]=(counts[s.src]||0)+1);
  const chips=document.getElementById('food-chips');
  if(chips){
    const key=TIERS.filter(t=>all.some(s=>s.tier===t))
      .map(t=>'<span class="key"><i style="background:'+TIER_COLOR[t]+'"></i>'+t+'</span>').join('');
    chips.innerHTML=Object.keys(SRC_META).filter(k=>counts[k]).map(k=>
        '<button type="button" class="chip'+(FOOD.enabled[k]?' on':' off')+'" data-s="'+k+'" style="--c:'+SRC_META[k].color+'">'
        +SRC_META[k].ic+' '+SRC_META[k].short+' <b>'+counts[k]+'</b></button>').join('')
      + (key?'<span class="chip-key">'+key+'</span>':'');
    chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      FOOD.enabled[b.dataset.s]=!FOOD.enabled[b.dataset.s]; drawFood();});
  }
  const note=document.getElementById('food-note');
  if(note){
    const reg=(FOOD.data.regions.filter(r=>r.id===FOOD.region)[0])||{};
    note.innerHTML='当前 <b>'+(reg.name||'')+'</b>'+(reg.badge?' · '+reg.badge:'')+' · 本地区收录 '+all.length+' 家,地图显示 '+list.length+' 家'
      +' · <span style="color:#8a93a3">坐标为街区示意(按地址编码),以实际为准</span>';
  }
  const body=document.getElementById('food-list-body');
  if(body){
    let h='';
    ['mine','tier','tabelog'].forEach(k=>{
      const arr=all.filter(s=>s.src===k);
      if(!arr.length) return;
      if(k==='tier'){
        TIERS.forEach(t=>{
          const g=arr.filter(s=>s.tier===t); if(!g.length) return;
          h+='<div class="fl-src"><span class="bdot" style="background:'+TIER_COLOR[t]+'"></span>tier 榜 · '+t+' ('+g.length+')</div>'
            +g.map(s=>'<div class="fl-i"><span>'+s.name+'</span><span class="fl-d">'+(s.hint||'')+(s.closed?' · 休 '+s.closed:'')+'</span></div>').join('');
        });
      } else {
        h+='<div class="fl-src">'+SRC_META[k].ic+' '+SRC_META[k].name+' ('+arr.length+')</div>'
          +arr.map(s=>'<div class="fl-i"><span>'+s.name+'</span><span class="fl-d">'
            +(s.score?'⭐ '+s.score:'')+(s.closed?' · 休 '+s.closed:'')+(s.addr?' · '+s.addr.slice(0,14):'')+'</span></div>').join('');
      }
    });
    body.innerHTML=h||'<div style="color:#8a93a3">本地区暂无收录</div>';
  }
}

function initFood(food){
  FOOD.data=food;
  FOOD.region=(food.regions[0]||{}).id;
  renderFoodMap();
  document.querySelectorAll('.rtab').forEach(b=>b.onclick=()=>{
    FOOD.region=b.dataset.r;
    document.querySelectorAll('.rtab').forEach(x=>x.classList.toggle('on',x===b));
    drawFood();
  });
  drawFood();
}

/* ===== 定位：点一下取一次，只在附近 3km 内找 ===== */
function distM(a,b){
  const R=6371000,toRad=x=>x*Math.PI/180;
  const la1=toRad(a[0]),lo1=toRad(a[1]),la2=toRad(b[0]),lo2=toRad(b[1]);
  const h=Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const WALK_MIN_KM=12;                 // 步行约 12 分钟/公里
function initLocate(){
  const btn=document.getElementById('btn-locate'),msg=document.getElementById('loc-msg'),panel=document.getElementById('loc-panel');
  if(!btn) return;
  let meMarker=null,meCircle=null,lastPos=null,lastAcc=0;
  const fmt=d=>d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km';
  const walkN=d=>Math.max(1,Math.round(d/1000*WALK_MIN_KM));
  const R_OPTS=[{v:1500,l:'≤1.5km'},{v:3000,l:'≤3km'}];

  function draw(){
    if(!lastPos) return;
    const la=lastPos[0],lo=lastPos[1];
    const all=foodShops().map(s=>({s,d:distM([la,lo],[s.lat,s.lon])})).sort((a,b)=>a.d-b.d);
    panel.hidden=false;
    if(!all.length){ panel.innerHTML='<div class="lp-h">还没有店铺数据</div>'; return; }
    const R=FOOD.radius||3000;
    let near=all.filter(o=>o.d<=R).slice(0,8), over=false;
    if(!near.length){ near=all.slice(0,3); over=true; }   // 3km 内没有 -> 给最近 3 家并标明超出
    const r0=near[0].s.region;                            // 先切地区(会重画地图)
    const tab=[].slice.call(document.querySelectorAll('.rtab')).filter(x=>x.dataset.r===r0)[0];
    if(tab && FOOD.region!==r0) tab.click();
    panel.innerHTML='<div class="lp-h">'+(over?'📍 3km 内没有收录的店，最近的是':'📍 附近（直线距离）')+'</div>'
      + '<div class="lp-r">'+R_OPTS.map(o=>'<button type="button" class="rbtn'+(R===o.v?' on':'')+'" data-r="'+o.v+'">'+o.l+'</button>').join('')+'</div>'
      + near.map(o=>'<div class="lp-i'+(over?' over':'')+'"><div>'+((SRC_META[o.s.src]||{}).ic||'')+' '+o.s.name
          +'<div class="lp-t">'+(o.s.src==='tier'?'tier 榜 · '+o.s.tier:(SRC_META[o.s.src]||{}).name)
          +(o.s.score?' · ⭐'+o.s.score:'')+(o.s.closed?' · 休 '+o.s.closed:'')+'</div></div>'
          +'<div class="lp-d">'+fmt(o.d)+'<div class="lp-w">步行'+walkN(o.d)+'分</div></div></div>').join('')
      + (over?'<div class="lp-note">这几家都超出 3km，得坐地铁/打车——收录的百名店多在住宅区，不在商圈。</div>':'');
    panel.querySelectorAll('.rbtn').forEach(b=>b.onclick=()=>{FOOD.radius=+b.dataset.r;draw();});
    const FM=FOOD.map;
    if(FM){
      if(meMarker) FM.removeLayer(meMarker);
      if(meCircle) FM.removeLayer(meCircle);
      meCircle=L.circle([la,lo],{radius:Math.max(lastAcc,60),color:'#2e6fd8',weight:1,fillColor:'#2e6fd8',fillOpacity:.12}).addTo(FM);
      meMarker=L.marker([la,lo],{zIndexOffset:1000,icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],
        html:'<div style="width:18px;height:18px;border-radius:50%;background:#1b2a4a;border:3px solid #fff;box-shadow:0 0 0 4px rgba(46,111,216,.35)"></div>'})})
        .addTo(FM).bindPopup('📍 你的位置（精度约 '+lastAcc+' m）');
      FM.fitBounds(L.latLngBounds([[la,lo]].concat(near.map(o=>[o.s.lat,o.s.lon]))).pad(0.18));
    }
  }

  btn.onclick=()=>{
    if(!navigator.geolocation){ msg.textContent='这个浏览器不支持定位'; return; }
    btn.disabled=true; msg.textContent='定位中…（浏览器会弹权限，点「允许」）';
    navigator.geolocation.getCurrentPosition(onOk,onErr,{enableHighAccuracy:true,timeout:12000,maximumAge:120000});
  };
  function onErr(e){
    btn.disabled=false;
    const M={1:'定位被拒绝或不可用 — 请用 https 打开(本地 file:// 不给定位)并在弹窗点「允许」',
             2:'拿不到位置 — 国内 Chrome 的定位走 Google(被墙)常失败，可换 Safari，到日本后都正常',
             3:'定位超时，再点一次试试'};
    msg.textContent='❌ '+(M[e.code]||e.message||'定位失败');
  }
  function onOk(pos){
    btn.disabled=false;
    lastAcc=Math.round(pos.coords.accuracy||0);
    lastPos=[pos.coords.latitude,pos.coords.longitude];
    msg.innerHTML='✅ 已定位（精度约 '+lastAcc+' m）· 只在 <b>3km</b> 内找 · 再点一次刷新';
    draw();
  }
}

/* ===== 侧边栏 ===== */
function buildSide(data){
  const ic=t=>{const mm=(t||'').match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u);return mm?mm[0]:'📍';};
  const items=[{id:'sec-overview',ic:'📅',name:'行程速览'}]
    .concat(data.cities.map(c=>({id:'sec-'+c.id,ic:ic(c.title),name:c.city})))
    .concat(data.food?[{id:'sec-food',ic:'🗺',name:'美食地图'}]:[]);
  const nav=document.getElementById('side');
  if(!nav) return;
  nav.innerHTML='<div class="s-h">导航 · 日本行</div>'+items.map(i=>'<a href="#'+i.id+'" data-t="'+i.id+'">'+i.ic+' '+i.name+'</a>').join('');
  const links=[...nav.querySelectorAll('a')];
  const setOn=id=>links.forEach(a=>a.classList.toggle('on',a.dataset.t===id));
  const secs=items.map(i=>document.getElementById(i.id)).filter(Boolean);
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{
      const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
      if(vis.length) setOn(vis[0].target.id);
    },{rootMargin:'-70px 0px -55% 0px',threshold:0});
    secs.forEach(s=>io.observe(s));
  }
  setOn(items[0].id);
  links.forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.t);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});setOn(a.dataset.t);}});
}

// 数据加载: 优先取 data.json(改了立刻生效);file:// 下浏览器禁止 fetch 本地文件
// (origin=null 被 CORS 拦),退回页面内联的同一份数据 → 双击/本地索引都能打开。
const loadData=()=>{
  const inline=()=>JSON.parse(document.getElementById('trip-data').textContent);
  if(location.protocol==='file:') return Promise.resolve(inline());
  return fetch('data.json?v='+Date.now())
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .catch(()=>inline());
};

    <div>· <b>其他</b>:现金+Suica/ICOCA;箱根备浴衣;二奢去代官山/中目黑/表参道/银座</div>
  </div></div>`;
  const foot=`<div class="wrap"><div class="foot">酒店/二奢店坐标为街区示意(酒店锚点待定,定了我更新) · 数字=当天先后顺序 · 数据源 data.json · 地图 © OpenStreetMap · Leaflet</div></div>`;
  const food=data.food?renderFood(data.food):'';
